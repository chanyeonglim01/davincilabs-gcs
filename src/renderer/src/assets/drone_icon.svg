<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 83">
  <defs>
    <filter id="droneShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <g filter="url(#droneShadow)">
    <!-- rotor discs -->
    <circle cx="26" cy="16" r="14" fill="none" stroke="#ECDFCC" stroke-opacity="0.3" stroke-width="2"/>
    <circle cx="102" cy="16" r="14" fill="none" stroke="#ECDFCC" stroke-opacity="0.3" stroke-width="2"/>
    <circle cx="26" cy="72" r="11.5" fill="none" stroke="#ECDFCC" stroke-opacity="0.22" stroke-width="2"/>
    <circle cx="102" cy="72" r="11.5" fill="none" stroke="#ECDFCC" stroke-opacity="0.22" stroke-width="2"/>

    <!-- arms (dark outline + cream fill) -->
    <g stroke="#181C14" stroke-width="8" stroke-linecap="round">
      <line x1="64" y1="44" x2="26" y2="16"/>
      <line x1="64" y1="44" x2="102" y2="16"/>
      <line x1="64" y1="44" x2="26" y2="72"/>
      <line x1="64" y1="44" x2="102" y2="72"/>
    </g>
    <g stroke="#ECDFCC" stroke-width="3.5" stroke-linecap="round">
      <line x1="64" y1="44" x2="26" y2="16"/>
      <line x1="64" y1="44" x2="102" y2="16"/>
      <line x1="64" y1="44" x2="26" y2="72"/>
      <line x1="64" y1="44" x2="102" y2="72"/>
    </g>

    <!-- motor pods -->
    <circle cx="26" cy="16" r="8" fill="#ECDFCC" stroke="#181C14" stroke-width="3"/>
    <circle cx="102" cy="16" r="8" fill="#ECDFCC" stroke="#181C14" stroke-width="3"/>
    <circle cx="26" cy="72" r="7" fill="#ECDFCC" stroke="#181C14" stroke-width="3"/>
    <circle cx="102" cy="72" r="7" fill="#ECDFCC" stroke="#181C14" stroke-width="3"/>

    <!-- nav lights: red = port/left, green = starboard/right (nose points up) -->
    <circle cx="26" cy="16" r="2.6" fill="#FF3B30"/>
    <circle cx="102" cy="16" r="2.6" fill="#34C759"/>

    <!-- body -->
    <rect x="49" y="28" width="30" height="30" rx="9" fill="#ECDFCC" stroke="#181C14" stroke-width="3.5"/>

    <!-- nose chevron -->
    <path d="M64 21 L57 30 L71 30 Z" fill="#181C14"/>

    <!-- camera / gimbal -->
    <circle cx="64" cy="47" r="4.5" fill="#181C14"/>
    <circle cx="64" cy="47" r="1.8" fill="#3C3D37"/>
  </g>
</svg>
